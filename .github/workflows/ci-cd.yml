name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing Suite
  # ============================================================================
  test-backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies (OpenCV & Computer Vision)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
          MONGODB_URI: ""
          MONGODB_DB_NAME: optiscan_test_db
        run: |
          pytest -v --durations=10

  # ============================================================================
  # 2. Frontend Build & Verification
  # ============================================================================
  build-frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 3. Backend Deployment (Render) - Gated by Tests
  # ============================================================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning title=Render Deploy Skipped::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository secrets. See docs/CI_CD_SETUP.md."
            exit 0
          fi

          echo "Initiating Render backend deployment..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          echo "Render response status: $HTTP_STATUS"
          cat response.txt

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment!"
          else
            echo "::error::Render deployment trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

  # ============================================================================
  # 4. Frontend Deployment (Vercel) - Gated by Tests
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel Production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Vercel Deploy Skipped::VERCEL_TOKEN secret is not configured in GitHub repository secrets. See docs/CI_CD_SETUP.md."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install --global vercel@latest

          echo "Pulling Vercel environment information..."
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          echo "Building production bundle via Vercel..."
          vercel build --prod --token="$VERCEL_TOKEN"

          echo "Deploying prebuilt artifacts to Vercel production..."
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
